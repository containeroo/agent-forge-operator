---
name: Run tests

on:
  workflow_call:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true

      - name: Set up Kind Cluster
        run: |
          make kind

      - name: Run Unit Tests
        run: |
          make test

      - name: Run vSphere Simulator Tests
        run: make test-vcsim

      - name: Run E2E Tests
        run: |
          make test-e2e
